name: Record daily traffic

# 매일 Vercel Analytics의 어제 방문자·유입원을 src/data/traffic-daily.csv 에 한 줄 추가한다.
# Vercel Hobby 플랜은 31일치만 보여 주기 때문에, 성장 곡선은 이 CSV에만 쌓인다.
# 필요한 시크릿: VERCEL_TOKEN (Vercel 계정 설정 > Tokens, 팀 범위 지정, 읽기만 쓰므로 만료일을 두어도 된다).
# 며칠 실패해도 다음 실행이 빠진 날을 채운다(31일 안이면).
# 커밋 메시지의 [skip ci]는 이 한 줄 때문에 Vercel이 다시 배포하지 않게 하려는 것이다(CSV는 사이트에 안 들어간다).

on:
  schedule:
    - cron: '30 1 * * *' # 매일 01:30 UTC (10:30 KST). 어제(UTC) 하루가 끝난 뒤.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: traffic-daily
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record yesterday's traffic
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/record-traffic-daily.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- src/data/traffic-daily.csv; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/traffic-daily.csv
          git commit -m "일별 방문자 기록 추가 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
