name: Tweet new events

# Posts a tweet for any event in src/data/events.json that hasn't been
# tweeted yet (tracked in src/data/tweeted-events.json). Triggers on any
# push to main that touches events.json - including the KOPIS auto-fetch
# workflow's own pushes - so new shows go out on X without a manual step.
#
# Set up 2026-09-01. Needs 4 repo secrets (Settings > Secrets and variables >
# Actions): X_API_KEY, X_API_KEY_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET
# (OAuth 1.0a User Context, app permission level "Read and Write").
#
# See scripts/tweet-new-events.mjs for the posting logic - it only ever
# tweets ids not already listed in src/data/tweeted-events.json, which was
# pre-seeded with every event that existed before this pipeline went live so
# turning this on doesn't backlog-blast old shows.

on:
  push:
    branches: [main]
    paths:
      - 'src/data/events.json'
  workflow_dispatch: {} # manual "Run workflow" for testing

permissions:
  contents: write

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tweet new events
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/tweet-new-events.mjs

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- src/data/tweeted-events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit tweeted-events.json
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tweeted-events.json
          git commit -m "chore: X 트윗 발행 기록 갱신"
          git push
