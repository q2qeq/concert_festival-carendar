name: Fetch KOPIS events

# Twice-weekly automated pull from KOPIS (공연예술통합전산망) into
# src/data/kopis-candidates.json AND, as of 2026-08-30, directly into
# src/data/events.json for any KOPIS title that matches a known J-pop artist
# (scripts/jpop-artists.mjs) - see the "J-pop 마이너 아티스트 자동 게시
# 파이프라인" section in README.md for the full rationale. Non-J-pop results still
# only go to kopis-candidates.json (NOT events.json) - fetch-kopis.mjs filters those
# down to a whitelist of major venues and skips anything that looks like it
# duplicates an existing event; what's left still needs a human to hand-copy into
# events.json with a real id/links.
#
# UPDATED 2026-08-30: this workflow now commits AND PUSHES STRAIGHT TO MAIN
# instead of opening a PR - user explicitly decided a J-pop events.json diff
# going live immediately is fine, since the site is just public concert-listing
# info and there's no real downside to an auto-added show appearing without a
# manual review step first (previously it opened a PR via kopis-auto-update so
# a human could sanity-check the diff before it deployed). If this should go
# back to a PR-gated flow later, ask to restore it - the previous PR-based
# version is in git history (see the commit that introduced this comment).
#
# Bumped from weekly to Mon+Thu (2026-08-28) for fall festival season, when new
# registrations come in faster; can drop back to weekly (just Monday) once things
# quiet down. Either cadence keeps the KOPIS API key from auto-cancelling (it
# expires after 3 months of no use). For an immediate one-off refresh instead of
# waiting for the next scheduled run, use "Run workflow" on the Actions tab
# (workflow_dispatch below), or - since 2026-08-30 - run `npm run fetch:kopis`
# directly in a live device-linked session (kopis.or.kr is reachable via
# device_bash; still unconfirmed whether Claude's own cloud sandbox can reach it).

on:
  schedule:
    - cron: '0 0 * * 1,4' # every Monday & Thursday 00:00 UTC (09:00 KST)
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  fetch-kopis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch KOPIS listings
        env:
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
        run: npm run fetch:kopis

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- src/data/kopis-candidates.json src/data/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/kopis-candidates.json src/data/events.json
          git commit -m "chore: KOPIS 자동 수집 갱신 (kopis-candidates.json + J-pop events.json)"
          git push
