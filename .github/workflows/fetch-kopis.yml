name: Fetch KOPIS events

# Twice-weekly automated pull from KOPIS (공연예술통합전산망) into
# src/data/kopis-candidates.json — NOT src/data/events.json, which is the only
# file the site actually renders (src/lib/events.ts). fetch-kopis.mjs already
# filters raw KOPIS results down to a whitelist of major venues and skips
# anything that looks like it duplicates an existing event; what's left still
# needs a human to hand-copy into events.json with a real id/links, which is
# why this opens a PR instead of pushing straight to main. Bumped from weekly
# to Mon+Thu (2026-08-28) for fall festival season, when new registrations
# come in faster; can drop back to weekly (just Monday) once things quiet down.
# Either cadence keeps the KOPIS API key from auto-cancelling (it expires
# after 3 months of no use). For an immediate one-off refresh instead of
# waiting for the next scheduled run, either use "Run workflow" on the
# Actions tab (workflow_dispatch below), or just ask Claude to run
# `npm run fetch:kopis` locally — it updates kopis-candidates.json directly
# in this repo checkout, no need to wait on GitHub Actions.

on:
  schedule:
    - cron: '0 0 * * 1,4' # every Monday & Thursday 00:00 UTC (09:00 KST)
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-kopis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch KOPIS listings
        env:
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
        run: npm run fetch:kopis

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- src/data/kopis-candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with new events
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: KOPIS 자동 수집 후보 갱신 (kopis-candidates.json)"
          title: "KOPIS 자동 수집 후보 갱신 (자동 생성)"
          body: |
            매주 실행되는 KOPIS 자동 수집 워크플로우가 `src/data/kopis-candidates.json`을
            새로 갱신했습니다. 이 파일은 사이트가 실제로 읽지 않는 스테이징 파일입니다
            (`src/lib/events.ts`는 `events.json`만 읽습니다) — 머지해도 사이트에는
            아무 영향이 없습니다.

            **할 일**
            - [ ] `kopis-candidates.json`을 열어서 마음에 드는 공연이 있는지 확인
            - [ ] 있으면 `events.json`에 손으로 옮기고, 실제 `ticketUrl`/`officialUrl`
                  등 공식 링크를 검색해서 채운 뒤 커밋
            - [ ] 이 PR은 그냥 머지해도 되고 (다음 주 실행 때 다시 덮어써짐), 필요 없으면
                  닫아도 됩니다

            자동 생성된 PR입니다.
          branch: kopis-auto-update
          delete-branch: true
          labels: |
            automated
            kopis
